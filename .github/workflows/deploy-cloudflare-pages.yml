name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # The sync job commits with the default GITHUB_TOKEN, and such pushes do NOT
  # trigger `on: push` workflows. Chain the deploy off the sync run so bot-made
  # data refreshes actually reach the live site.
  workflow_run:
    workflows: ["Sync fast-rising GitHub projects"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy static site to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy . --project-name github-project-directory --branch main
